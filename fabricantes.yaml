# Fabricantes / laboratorios processados em cada rodada.
# Gerado a partir de docs/Fabricantes atualizado.xlsx (comprador: YURI TOSO), que traz
# tambem a coluna E-MAIL. A planilha anterior (FABRICANTES ENVIO MAPA.xlsx) nao tinha
# contato nenhum e ficou obsoleta.
#
# nome          : identificador usado no nome da pasta de saida e nos logs.
# codigos       : codigos do Geweb. Varios codigos = UM relatorio so, com todos somados
#                 (as linhas da planilha unidas por " - "). Use "codigo: 13963" quando for um so.
# mensal        : true (padrao) gera o mes anterior fechado, no 1o DIA UTIL do mes
#                 (o calculo pula sabado, domingo e feriado nacional).
# dias_semana   : dias em que este fabricante recebe TAMBEM um envio semanal
#                 (segunda, terca, quarta, quinta, sexta). Vazio = so o mensal.
# janela_semanal: o que o envio semanal cobre.
#                 acumulado_mes (padrao) = do dia 1o do mes corrente ate ontem;
#                 semana_fechada         = segunda a sexta da semana anterior.
#                 No 1o dia util o acumulado ainda esta vazio: nesse unico dia o envio
#                 semanal fica coberto pelo mensal do mes fechado.
# ativo         : false pula o fabricante sem remove-lo da lista.
# contatos      : para quem o mapa deste laboratorio vai, usado por `python -m src.disparo`.
#                 Sem contato o laboratorio continua sendo extraido normalmente — so nao
#                 entra na montagem dos envios, e aparece nominalmente no resumo.
#
#                     contatos:
#                       emails: [mapa.estoque@laboratorio.com.br]
#                       copia: [yuri@sogamax.com.br]     # opcional
#                       whatsapp: ["+5511999999999"]     # opcional, formato internacional
#                       canais: [email]                  # email | whatsapp | os dois
#
#                 Quando o mesmo laboratorio aparece em mais de uma entrada (EUROFARMA e
#                 EUROFARMA_RX, as duas Brace Pharma, ACHE e BIOSINTETICA), use ancora do
#                 YAML para nao duplicar o dado — declare `contatos: &eurofarma` na primeira
#                 e `contatos: *eurofarma` na outra.
#
# comprador     : OPCIONAL. Quem compra deste laboratorio — assina a mensagem e recebe a
#                 resposta da industria. Ausente, valem COMPRADOR e RESPONDER_PARA do .env,
#                 que e o caso enquanto houver um comprador so.
#
#                     comprador: &yuri
#                       nome: YURI TOSO
#                       responder_para: yuritoso@sogamax.com.br
#
#                 Nos demais laboratorios do mesmo comprador, `comprador: *yuri`. A ancora
#                 precisa ser declarada ANTES de ser usada, na ordem do arquivo.
#
#                 Laboratorio com DOIS compradores: `responder_para` aceita varios enderecos
#                 separados por virgula, e o `nome` e texto livre (assina a mensagem):
#
#                     comprador:
#                       nome: YURI TOSO e MARIA SILVA
#                       responder_para: yuritoso@sogamax.com.br, maria@sogamax.com.br
#
#                 Isso faz a RESPOSTA da industria chegar aos dois. Para o segundo comprador
#                 tambem receber o mapa no momento do envio, ponha o e-mail dele em
#                 `contatos: copia` — sao coisas diferentes.
#
# Confira o plano antes de rodar de verdade:
#     python -m src.main --planejar
#     python -m src.main --planejar --hoje 2026-09-01
#
# Os nomes entre parenteses nos comentarios sao como o codigo aparece NO GEWEB — foram
# conferidos um a um contra logs/fabricantes-geweb.txt. Para atualizar essa lista:
#     python -m src.descobrir --fabricantes

fabricantes:
