  #
  # Ate aqui este arquivo so tinha enderecos internos, e isso era uma segunda protecao:
  # nao havia como um mapa chegar a um fornecedor, porque nenhum fornecedor existia no
  # cadastro. Essa camada acabou. Agora a UNICA coisa entre o sistema e as industrias e
  # a trava DESTINATARIO_TESTE, no .env:
  #
  #   preenchida  -> todo e-mail vai para os enderecos de teste, e a `copia` e suprimida;
  #   vazia       -> os e-mails vao para as INDUSTRIAS, nos enderecos abaixo.
  #
  # Esvazia-la e a acao que libera o envio real. Antes disso, confira a leva com
